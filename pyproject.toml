[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ox2r-swr-consolidation"
version = "0.1.0"
description = "Rate-based model linking orexin signalling to SWR statistics and hippocampal consolidation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "mat73>=0.60",
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["common"]